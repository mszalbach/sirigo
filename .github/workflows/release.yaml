name: Release

env:
  # renovate: datasource=golang-version packageName=golang
  GOLANG_VERSION: '1.27.3'

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 3" # every Wednesday at 00:00 UTC

jobs:
  qa:
    uses: ./.github/workflows/ci.yaml

  tag:
    needs: qa
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.semantic-release.outputs.release_tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - name: Install Semantic Release
        run: |
          npm install --no-save semantic-release @semantic-release/commit-analyzer

      - name: Run Semantic Release
        id: semantic-release
        run: |
          set -euo pipefail
          before_tags="$(git tag --list | sort)"
          npx semantic-release
          after_tags="$(git tag --list | sort)"
          mapfile -t new_tags < <(comm -13 <(printf '%s\n' "$before_tags") <(printf '%s\n' "$after_tags"))
          if (("${#new_tags[@]}" > 1)); then
            echo "Expected at most one new release tag, found: ${new_tags[*]}" >&2
            exit 1
          fi
          printf 'release_tag=%s\n' "${new_tags[0]:-}" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.release_tag != ''
    permissions:
      actions: read # needed for sbom task to see the release
      contents: write # needed by goreleaser to write release to github
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.release_tag }}
          fetch-depth: 0 # needed for goreleaser to correctly create changelog

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache: true

      - name: Set up Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}